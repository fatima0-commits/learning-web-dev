<!DOCTYPE HTML>
<html lang="en">
<head>
    <title> learn input</title>
    
</head>
<body>
    <main>
        <form action="https://httpbin.org/get" method="get">
            <p>
               <label for="FirstName">FirstName:</label>
               <input type="text" id="FiestName" name="FirstName" placeholder="ex:jane" required>
            </p>
            <p>
               <label for="LastName">LastName:</label>
               <input type="text" id="LastName" name="LastName" placeholder="ex:robirson" required>
            </p>
            <label for="phone">phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="ex: 06-53-58-49-14" pattern="[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}">
            <p>
                <label for="Password"> Password:</label>
                <input type="password" name="Password" placeholder="kil">
            </p>
            <p>
                <label for="coffee">favourite coffee:</label>
                <select name="coffee" id="coffee">
                     <option value="selected">choose your favourite coffe!</option>
                    <option value="cappuccino">cappuccino</option>
                    <option value="americano">americano</option>
                    <option value="latte">latte</option>
                    <option value="frapuccino">frapuccino</option>
                    <option value="other">other</option>
                </select>
            </p>
    </main>
</body>
